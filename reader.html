<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Photobook</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; display: block; }
    body { overflow: hidden; background: #FEFAF3; }
  </style>
</head>
<body>
  <iframe id="reader" title="Magazine reader" allowfullscreen></iframe>
  <script>
    const target = new URL('index.html', location.href);
    target.search = location.search;
    target.searchParams.set('reader', '1');
    document.getElementById('reader').src = target.toString();
  </script>
</body>
</html>
